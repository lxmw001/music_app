<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>YouTube Player</title>
  <style>
    body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    .slot { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #slot0 { z-index: 1; }
    #slot1 { z-index: 2; }
  </style>
</head>
<body>
  <div id="slot0"></div>
  <div id="slot1"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    'use strict';

    // === State ===
    var players = [null, null];
    var playersReady = [false, false];
    var activeSlot = 0;
    var apiReady = false;
    var timeUpdateTimer = null;
    var pendingCrossfade = null;
    var loadingSlot = -1;
    var currentVolume = 100;
    var cmdQueue = [];

    // === YouTube Player State Constants ===
    var STATE_UNSTARTED = -1;
    var STATE_ENDED = 0;
    var STATE_PLAYING = 1;
    var STATE_PAUSED = 2;
    var STATE_BUFFERING = 3;
    var STATE_CUED = 5;

    // === Event Bridge ===
    function postEvent(type, data) {
      var payload = JSON.stringify({ type: type, data: data || {} });
      if (window.AndroidBridge && AndroidBridge.onEvent) {
        AndroidBridge.onEvent(payload);
      } else {
        console.log('[Event] ' + payload);
      }
    }

    // === Helpers ===
    function errorMessageFor(code) {
      switch (code) {
        case 2:   return 'Invalid video parameter';
        case 5:   return 'HTML5 player error';
        case 100: return 'Video not found or removed';
        case 101: return 'Embedding not allowed by owner';
        case 150: return 'Embedding not allowed by owner';
        case 152: return 'Video unavailable';
        default:  return 'Unknown error (' + code + ')';
      }
    }

    function stateNameFor(state) {
      switch (state) {
        case STATE_UNSTARTED: return 'unstarted';
        case STATE_ENDED:     return 'ended';
        case STATE_PLAYING:   return 'playing';
        case STATE_PAUSED:    return 'paused';
        case STATE_BUFFERING: return 'buffering';
        case STATE_CUED:      return 'cued';
        default:              return 'unknown';
      }
    }

    // === YouTube IFrame API Ready ===
    window.onYouTubeIframeAPIReady = function() {
      apiReady = true;
      createPlayer(0);
      createPlayer(1);
    };

    function createPlayer(slot) {
      players[slot] = new YT.Player('slot' + slot, {
        width: '100%',
        height: '100%',
        videoId: '',
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          playsinline: 1,
          rel: 0,
          iv_load_policy: 3,
          origin: 'https://www.youtube.com'
        },
        events: {
          onReady: function(e) { onPlayerReady(e, slot); },
          onStateChange: function(e) { onPlayerStateChange(e, slot); },
          onError: function(e) { onPlayerError(e, slot); }
        }
      });
    }

    // === Player Event Handlers ===
    function onPlayerReady(e, slot) {
      playersReady[slot] = true;
      postEvent('ready', { slot: slot });
      if (playersReady[0] && playersReady[1]) {
        postEvent('ready', { allReady: true });
        flushQueue();
      }
    }

    function onPlayerStateChange(e, slot) {
      var state = e.data;
      var stateName = stateNameFor(state);
      postEvent('stateChange', { slot: slot, state: state, stateName: stateName });

      // Fire 'loaded' when a video finishes loading
      if (loadingSlot === slot && (state === STATE_PLAYING || state === STATE_CUED)) {
        postEvent('loaded', { slot: slot });
        loadingSlot = -1;
      }

      // Start/stop time updates for active slot
      if (slot === activeSlot) {
        if (state === STATE_PLAYING) {
          startTimeUpdateTimer();
        } else {
          stopTimeUpdateTimer();
        }
      }

      // Handle crossfade completion
      if (pendingCrossfade && pendingCrossfade.slot === slot && state === STATE_PLAYING) {
        completeCrossfade();
      }
    }

    function onPlayerError(e, slot) {
      var code = e.data;
      postEvent('error', { slot: slot, code: code, message: errorMessageFor(code) });
    }

    // === Time Update Timer ===
    function startTimeUpdateTimer() {
      stopTimeUpdateTimer();
      timeUpdateTimer = setInterval(function() {
        if (players[activeSlot] && players[activeSlot].getCurrentTime) {
          try {
            var position = players[activeSlot].getCurrentTime();
            var duration = players[activeSlot].getDuration();
            postEvent('timeUpdate', {
              position: position,
              duration: duration
            });
          } catch (e) {
            // Ignore
          }
        }
      }, 500);
    }

    function stopTimeUpdateTimer() {
      if (timeUpdateTimer) {
        clearInterval(timeUpdateTimer);
        timeUpdateTimer = null;
      }
    }

    // === Crossfade ===
    function completeCrossfade() {
      var oldSlot = activeSlot;
      var newSlot = pendingCrossfade.slot;
      pendingCrossfade = null;
      activeSlot = newSlot;

      // Ramp volume: fade in new, fade out old over ~400ms
      var vol = currentVolume;
      var steps = 8;
      var i = 0;
      var fadeTimer = setInterval(function() {
        i++;
        var newVol = Math.round(vol * i / steps);
        var oldVol = Math.round(vol * (steps - i) / steps);
        try { if (players[newSlot]) players[newSlot].setVolume(newVol); } catch (e) {}
        try { if (players[oldSlot]) players[oldSlot].setVolume(oldVol); } catch (e) {}
        if (i >= steps) {
          clearInterval(fadeTimer);
          try { if (players[oldSlot]) players[oldSlot].stopVideo(); } catch (e) {}
          startTimeUpdateTimer();
        }
      }, 50);

      postEvent('loaded', { slot: newSlot, crossfade: true });
    }

    // === Command Queue ===
    function flushQueue() {
      while (cmdQueue.length > 0) {
        var args = cmdQueue.shift();
        window.__cmd.apply(null, args);
      }
    }

    // === Command Dispatcher ===
    window.__cmd = function(command) {
      var args = Array.prototype.slice.call(arguments);

      // Queue commands if API or players not ready
      if (!apiReady || !playersReady[0] || !playersReady[1]) {
        if (command !== 'getState') {
          cmdQueue.push(args);
        }
        return;
      }

      switch (command) {
        case 'load':      cmdLoad(args[1], args[2], args[3]); break;
        case 'crossfade': cmdCrossfade(args[1], args[2]);     break;
        case 'play':      cmdPlay();                         break;
        case 'pause':     cmdPause();                        break;
        case 'seek':      cmdSeek(args[1]);                   break;
        case 'stop':      cmdStop();                         break;
        case 'setVolume': cmdSetVolume(args[1]);             break;
        case 'getState':  cmdGetState();                      break;
        default:
          postEvent('error', { code: -1, message: 'Unknown command: ' + command });
      }
    };

    // === Command Implementations ===
    function cmdLoad(videoId, startSeconds, autoplay) {
      loadingSlot = activeSlot;
      var shouldAutoplay = autoplay !== false; // default true
      if (players[activeSlot]) {
        if (shouldAutoplay) {
          players[activeSlot].loadVideoById({
            videoId: videoId,
            startSeconds: startSeconds || 0
          });
        } else {
          players[activeSlot].cueVideoById({
            videoId: videoId,
            startSeconds: startSeconds || 0
          });
        }
      }
    }

    function cmdCrossfade(videoId, startSeconds) {
      var newSlot = activeSlot === 0 ? 1 : 0;
      loadingSlot = newSlot;
      pendingCrossfade = { slot: newSlot, videoId: videoId };
      if (players[newSlot]) {
        players[newSlot].loadVideoById({
          videoId: videoId,
          startSeconds: startSeconds || 0
        });
      }
    }

    function cmdPlay() {
      if (players[activeSlot] && players[activeSlot].playVideo) {
        players[activeSlot].playVideo();
      }
    }

    function cmdPause() {
      if (players[activeSlot] && players[activeSlot].pauseVideo) {
        players[activeSlot].pauseVideo();
      }
    }

    function cmdSeek(seconds) {
      if (players[activeSlot] && players[activeSlot].seekTo) {
        players[activeSlot].seekTo(seconds, true);
      }
    }

    function cmdStop() {
      stopTimeUpdateTimer();
      if (players[activeSlot] && players[activeSlot].stopVideo) {
        players[activeSlot].stopVideo();
      }
    }

    function cmdSetVolume(volume) {
      currentVolume = Math.round(volume);
      for (var i = 0; i < 2; i++) {
        if (players[i] && players[i].setVolume) {
          try { players[i].setVolume(currentVolume); } catch (e) {}
        }
      }
    }

    function cmdGetState() {
      if (players[activeSlot] && players[activeSlot].getPlayerState) {
        var state = STATE_UNSTARTED;
        var position = 0;
        var duration = 0;
        try { state = players[activeSlot].getPlayerState(); } catch (e) {}
        try { position = players[activeSlot].getCurrentTime(); } catch (e) {}
        try { duration = players[activeSlot].getDuration(); } catch (e) {}
        postEvent('stateChange', {
          slot: activeSlot,
          state: state,
          stateName: stateNameFor(state),
          position: position,
          duration: duration
        });
      }
    }

    // === Global Error Handler ===
    window.onerror = function(message, source, lineno, colno, error) {
      postEvent('error', { code: -1, message: 'JS: ' + message });
      return false;
    };
  </script>
</body>
</html>
