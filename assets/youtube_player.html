<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>YouTube Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    iframe.inactive {
      /* Keep off-screen but alive so audio continues */
      top: -9999px;
    }
  </style>
</head>
<body>
  <iframe id="player0" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <iframe id="player1" class="inactive" allow="autoplay; fullscreen" allowfullscreen></iframe>

  <script>
    'use strict';

    var slots = [
      document.getElementById('player0'),
      document.getElementById('player1')
    ];
    var activeSlot = 0;
    var currentVideoId = ['', ''];
    var timeTimer = null;
    var stateCheckTimer = null;

    // === Event Bridge ===
    function postEvent(type, data) {
      var payload = JSON.stringify({ type: type, data: data || {} });
      if (window.AndroidBridge && AndroidBridge.onEvent) {
        AndroidBridge.onEvent(payload);
      } else {
        console.log('[YTPlayer] ' + payload);
      }
    }

    function buildEmbedUrl(videoId, autoplay, startSeconds) {
      var start = Math.floor(startSeconds || 0);
      return 'https://www.youtube.com/embed/' + videoId
        + '?autoplay=' + (autoplay !== false ? '1' : '0')
        + '&controls=0'
        + '&playsinline=1'
        + '&rel=0'
        + '&fs=0'
        + '&modestbranding=1'
        + '&iv_load_policy=3'
        + '&disablekb=1'
        + '&start=' + start
        + '&enablejsapi=1'
        + '&origin=' + encodeURIComponent('https://www.youtube.com');
    }

    // === YT IFrame API (for postMessage control) ===
    // We use postMessage to control the iframes since they're same-origin embeds.
    function sendToPlayer(slot, func, args) {
      var msg = JSON.stringify({
        event: 'command',
        func: func,
        args: args || []
      });
      slots[slot].contentWindow.postMessage(msg, '*');
    }

    // === State tracking via postMessage from YouTube ===
    window.addEventListener('message', function(e) {
      var data;
      try { data = JSON.parse(e.data); } catch (_) { return; }
      if (!data || data.channel !== 'widget') return;

      var info = data.info;
      if (!info) return;

      // Determine which slot sent this
      var slot = -1;
      for (var i = 0; i < slots.length; i++) {
        try {
          if (slots[i].contentWindow === e.source) { slot = i; break; }
        } catch (_) {}
      }
      if (slot < 0) return;

      if (info.playerState !== undefined) {
        var state = info.playerState;
        postEvent('stateChange', { slot: slot, state: state });

        if (slot === activeSlot) {
          if (state === 1) { // playing
            startTimeTimer();
          } else if (state === 0) { // ended
            stopTimeTimer();
          }
        }
      }

      if (info.duration !== undefined && slot === activeSlot) {
        postEvent('timeUpdate', {
          position: info.currentTime || 0,
          duration: info.duration
        });
      }
    }, false);

    // === Time polling (postMessage doesn't always give continuous updates) ===
    function startTimeTimer() {
      stopTimeTimer();
      timeTimer = setInterval(function() {
        // Request current time/duration from active player
        sendToPlayer(activeSlot, 'getCurrentTime', []);
        // Poll state too
        sendToPlayer(activeSlot, 'getDuration', []);
      }, 500);
    }

    function stopTimeTimer() {
      if (timeTimer) { clearInterval(timeTimer); timeTimer = null; }
    }

    // === Command Dispatcher ===
    window.__cmd = function(command, arg1, arg2, arg3) {
      switch (command) {
        case 'load':
          cmdLoad(arg1, arg2, arg3);
          break;
        case 'crossfade':
          cmdCrossfade(arg1, arg2);
          break;
        case 'play':
          sendToPlayer(activeSlot, 'playVideo', []);
          startTimeTimer();
          break;
        case 'pause':
          sendToPlayer(activeSlot, 'pauseVideo', []);
          stopTimeTimer();
          break;
        case 'seek':
          sendToPlayer(activeSlot, 'seekTo', [parseFloat(arg1), true]);
          break;
        case 'stop':
          sendToPlayer(activeSlot, 'stopVideo', []);
          stopTimeTimer();
          break;
        case 'setVolume':
          sendToPlayer(activeSlot, 'setVolume', [Math.round(parseFloat(arg1) * 100)]);
          break;
        default:
          postEvent('error', { code: -1, message: 'Unknown command: ' + command });
      }
    };

    function cmdLoad(videoId, startSeconds, autoplay) {
      currentVideoId[activeSlot] = videoId;
      var url = buildEmbedUrl(videoId, autoplay !== false, startSeconds);
      slots[activeSlot].src = url;
      slots[activeSlot].className = '';
      postEvent('loaded', { slot: activeSlot, videoId: videoId });
      startTimeTimer();
    }

    function cmdCrossfade(videoId, startSeconds) {
      var newSlot = activeSlot === 0 ? 1 : 0;
      currentVideoId[newSlot] = videoId;
      var url = buildEmbedUrl(videoId, true, startSeconds);
      slots[newSlot].src = url;
      slots[newSlot].className = '';
      // Mute old slot
      sendToPlayer(activeSlot, 'setVolume', [0]);
      activeSlot = newSlot;
      postEvent('loaded', { slot: newSlot, videoId: videoId });
      startTimeTimer();
    }

    // Signal ready immediately — no API init needed for direct embeds
    postEvent('ready', { allReady: true });

    // === Global Error Handler ===
    window.onerror = function(message) {
      postEvent('error', { code: -1, message: 'JS: ' + message });
      return false;
    };
  </script>
</body>
</html>
